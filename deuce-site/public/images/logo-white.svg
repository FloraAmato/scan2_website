<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <!-- Document icon -->
  <g transform="translate(0, 5)">
    <!-- Document body -->
    <rect x="5" y="5" width="35" height="45" fill="white" stroke="white" stroke-width="1" rx="2"/>
    <!-- Document lines -->
    <line x1="12" y1="15" x2="33" y2="15" stroke="#1a3a6e" stroke-width="2"/>
    <line x1="12" y1="23" x2="33" y2="23" stroke="#1a3a6e" stroke-width="2"/>
    <line x1="12" y1="31" x2="28" y2="31" stroke="#1a3a6e" stroke-width="2"/>
  </g>

  <!-- Gavel -->
  <g transform="translate(25, 0)">
    <!-- Gavel head -->
    <rect x="15" y="20" width="25" height="12" fill="#f4c430" rx="2" transform="rotate(-45, 27.5, 26)"/>
    <!-- Gavel handle -->
    <rect x="30" y="30" width="5" height="25" fill="#f4c430" rx="1" transform="rotate(-45, 32.5, 42.5)"/>
  </g>

  <!-- EU Stars (simplified arc) -->
  <g transform="translate(30, 5)">
    <circle cx="20" cy="8" r="2" fill="#f4c430"/>
    <circle cx="28" cy="5" r="2" fill="#f4c430"/>
    <circle cx="36" cy="5" r="2" fill="#f4c430"/>
    <circle cx="44" cy="8" r="2" fill="#f4c430"/>
    <circle cx="50" cy="14" r="2" fill="#f4c430"/>
  </g>

  <!-- DEUCE Text -->
  <text x="90" y="42" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="white">DEUCE</text>
</svg>
