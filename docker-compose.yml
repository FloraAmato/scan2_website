# DEUCE Website Docker Compose
#
# For LOCAL testing, uncomment ports and comment out networks sections
# For PRODUCTION (Caddy), use edge network without ports

services:
  deuce_website:
    build: .
    restart: unless-stopped
    # LOCAL: Uncomment to expose on port 8080
    # ports:
    #   - "8080:80"
    # PRODUCTION: Comment out for local testing
    networks:
      - edge

# PRODUCTION: Comment out for local testing
networks:
  edge:
    external: true
