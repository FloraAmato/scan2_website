server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Prevent port stripping on any redirects
    absolute_redirect off;
    port_in_redirect on;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle all other routes
    location / {
        # First try the exact file, then directory's index.html, then .html extension
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
